[package]
name = "calm-days"
version = "0.1.0"
edition = "2021"
description = "A calm calendar and to-do app with smart text reading. Rust, no JS framework."

[dependencies]
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

# Low-memory host: no debug info in dev and test builds.
[profile.dev]
debug = 0

[profile.test]
debug = 0
